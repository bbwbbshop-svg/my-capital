const $=id=>document.getElementById(id), view=$('view'),dlg=$('dlg');const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state={ops:[],rates:{},goals:[],capital:[],payments:[],theme:'auto'};try{Object.assign(state,JSON.parse(localStorage.getItem('capital-v1')||'{}'))}catch{}state.history=Array.isArray(state.history)?state.history:[];let selectedDay=today();let tab=0,month=today().slice(0,7);$('month').value=month;const save=()=>localStorage.setItem('capital-v1',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const formatMoney=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';const money=n=>state.hideAmounts?`<span class="masked-money" role="button" tabindex="0" data-value="${Number(n)}" onclick="revealMoney(event,this)" onkeydown="if(event.key==='Enter'||event.key===' ')revealMoney(event,this)">•••• ₽</span>`:formatMoney(n);function revealMoney(e,el){e.stopPropagation();e.preventDefault();clearTimeout(el.revealTimer);el.textContent=formatMoney(el.dataset.value);el.revealTimer=setTimeout(()=>el.textContent='•••• ₽',5000)}function eye(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>${state.hideAmounts?'<path d="M3 3l18 18"/>':''}</svg>`}function togglePrivacy(){state.hideAmounts=!state.hideAmounts;save();render()}const sum=a=>a.reduce((s,o)=>s+Number(o.amount),0);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function calc(m){let a=state.ops.filter(o=>o.date.startsWith(m)),i=sum(a.filter(o=>o.type==='income')),f=sum(a.filter(o=>o.type==='fixed')),d=sum(a.filter(o=>o.type==='daily')),p=i*(state.rates[m]??10)/100,days=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return {a,i,f,d,p,days,b:(i-f-p)/days,r:i-f-d}}const tile=(label,n)=>`<section><small>${label}</small><h2>${money(n)}</h2></section>`;const row=(a,b)=>`<div class="row item"><span>${a}</span><strong>${b}</strong></div>`;const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;function openHomeTab(i){tab=i;menu(false);render();window.scrollTo(0,0)}function homeKey(e,i){if(e.key==='Enter'||e.key===' '){e.preventDefault();openHomeTab(i)}}function actionPair(edit,del){return `<div class="action-pair" role="group" aria-label="Действия"><button type="button" aria-label="Редактировать" onclick="${edit}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg></button><span class="action-divider" aria-hidden="true"></span><button type="button" aria-label="Удалить" onclick="${del}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>`}function render(){let c=calc(month),day=month===today().slice(0,7)?+today().slice(-2):month<today().slice(0,7)?c.days:0;let spent=sum(c.a.filter(o=>o.type==='daily'&&+o.date.slice(-2)<=day));let html='';if(tab===0){html=`<div class="home-group" role="button" tabindex="0" aria-label="Открыть бюджет" onclick="openHomeTab(1)" onkeydown="homeKey(event,1)"><div class="row group-title"><span>Бюджет</span><span aria-hidden="true">›</span></div><section><small>Остаток после расходов</small><div class="big">${money(c.r)}</div>${row('Доходы',money(c.i))}${row('Расходы',money(c.f+c.d))}</section><div class="grid">${tile('Бюджет на день',c.b)}${tile('Сальдо на сегодня',c.b*day-spent)}${tile('План накоплений',c.p)}${tile('Отклонение от плана',c.r-c.p)}</div></div><section class="home-link" role="button" tabindex="0" aria-label="Открыть календарь" onclick="openHomeTab(5)" onkeydown="homeKey(event,5)"><div class="row group-title"><h2>Ближайшие платежи</h2><span aria-hidden="true">›</span></div>${state.payments.filter(p=>p.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(p=>row(esc(p.name)+' · '+p.date,money(p.amount))).join('')||'Нет платежей'}</section><button class="primary" onclick="operation()">＋ Добавить операцию</button>`}if(tab===1){html=`<section><h2>План месяца</h2><label>Процент накоплений</label><input type="number" min="0" max="100" value="${state.rates[month]??10}" onchange="rate(this.value)">${row('Доходы',money(c.i))}${row('Обязательные расходы',money(c.f))}${row('Ежедневные расходы',money(c.d))}</section><button class="primary" onclick="operation()">＋ Операция</button><section><h2>Операции</h2>${c.a.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<div class="item action-row"><div>${esc(o.name)}<br><small>${o.date} · ${esc(o.category)}</small></div><strong>${o.type==='income'?'+':'−'}${money(o.amount)}</strong>${actionPair(`operation('${o.id}')`,`remove('ops','${o.id}')`)}</div>`).join('')||'Пока нет операций'}</section>`}if(tab===2)html=analyticsScreen();if(tab===3){html=`<button class="primary" onclick="goal()">＋ Цель</button>${state.goals.map(g=>`<section>${g.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(g.photo)?`<img class="goalphoto" src="${esc(g.photo)}" alt="">`:`<span class="goalicon">${esc(g.icon||"◎")}</span>`}<h2>${esc(g.name)}</h2><div class="big">${money(g.amount)}</div><small>из ${money(g.target)} · до ${g.date}</small>${bar(100*g.amount/g.target)}<div class="goal-action-row"><div>${row('Осталось',money(Math.max(0,g.target-g.amount)))}</div>${actionPair(`goal('${g.id}')`,`remove('goals','${g.id}')`)}</div></section>`).join('')||'<section>Добавь первую финансовую цель.</section>'}`}if(tab===4){let a=sum(state.capital.filter(x=>x.type==='asset')),b=sum(state.capital.filter(x=>x.type==='debt'));html=`<section><small>Чистый капитал</small><div class="big">${money(a-b)}</div>${row('Активы',money(a))}${row('Обязательства',money(b))}</section><button class="primary" onclick="capital()">＋ Актив / долг</button><section>${state.capital.map(o=>`<div class="item action-row"><div>${esc(o.name)}</div><strong>${money(o.amount)}</strong>${actionPair(`capital('${o.id}')`,`remove('capital','${o.id}')`)}</div>`).join('')}</section>`}if(tab===5){html=`<button class="primary" onclick="payment()">＋ Платёж</button><section><h2>Календарь платежей</h2>${state.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<div class="item"><div class="row"><strong>${esc(p.name)}</strong>${money(p.amount)}</div><small>${p.date} · ${p.repeat?'ежемесячно':'разовый'}</small><div><button onclick="paid('${p.id}')">Оплачен</button> <button onclick="remove('payments','${p.id}')">Удалить</button></div></div>`).join('')||'Нет платежей'}</section>`}if(tab===6){html=`<section><h2>Персонализация</h2><button class="category-link" onclick="openHomeTab(10)">Мои категории <span>›</span></button></section><section><h2>Данные</h2><button onclick="backup()">Резервная копия JSON</button> <button onclick="csv()">Экспорт CSV для Excel</button><label>Восстановить из JSON</label><input type="file" accept=".json" onchange="restore(this)"><p class="muted">Данные хранятся в этом браузере. Синхронизация и защита пока не подключены.</p></section>`}if(tab===7)html=dailyBudget(c);if(tab===8){let year=month.slice(0,4);html='<section><h2>Годовая сводка · '+year+'</h2>'+Array.from({length:12},(_,i)=>{let m=year+'-'+String(i+1).padStart(2,'0'),v=calc(m);return row(m,money(v.i-v.f-v.d))}).join('')+'</section>'}if(tab===9)html='<section><h2>История операций</h2>'+ (state.ops.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>row(esc(o.date+' · '+o.name),money(o.amount))).join('')||'Нет операций')+'</section>';if(tab===10)html=categoryScreen();document.querySelector('main h1').textContent=tab===2?'Аналитика':'Мой капитал';$('month').style.display=tab===2?'none':'';view.innerHTML=html; $('dailyFab').hidden=tab!==0;renderNav();$('fab').hidden=![0,1,2,7].includes(tab);$('menuButton').innerHTML=ico(7);$('theme').innerHTML=eye();$('theme').setAttribute('aria-label',state.hideAmounts?'Показать суммы':'Скрыть суммы');if(tab===5)view.insertAdjacentHTML('afterbegin',calendar());if(tab===4)view.insertAdjacentHTML('beforeend',historyChart());}

function analyticsMove(delta){let y=Number(month.slice(0,4)),m=Number(month.slice(5))-1;if(analysisPeriod==='year')y+=delta;else{m+=delta;if(m<0){m=11;y--}if(m>11){m=0;y++}}if(y<1||y>9999)return;month=String(y).padStart(4,'0')+'-'+String(m+1).padStart(2,'0');$('month').value=month;analyticsSelected=null;render()}
function analyticsPick(i){analyticsSelected=Number(i);render()}
function analyticsScreen(){let y=month.slice(0,4),mi=Number(month.slice(5))-1,yearly=analysisPeriod==='year',ms=Array.from({length:12},(_,i)=>calc(y+'-'+String(i+1).padStart(2,'0'))),active=ms.filter(x=>x.a.length>0).length,chosen=analyticsSelected??mi,cur=ms[mi],total=k=>ms.reduce((s,x)=>s+x[k],0),inc=yearly?total('i'):cur.i,exp=yearly?total('f')+total('d'):cur.f+cur.d,rest=inc-exp,ratio=inc?100*rest/inc:0;
let html=`<div class="analytics-switch" role="group" aria-label="Период аналитики"><button class="${yearly?'':'primary'}" aria-pressed="${!yearly}" onclick="analysisPeriod='month';render()">За месяц</button><button class="${yearly?'primary':''}" aria-pressed="${yearly}" onclick="analysisPeriod='year';render()">За год</button></div><section class="analytics-period"><button aria-label="Предыдущий период" onclick="analyticsMove(-1)">‹</button><strong>${yearly?y+' год':analyticsMonths[mi]+' '+y}</strong><button aria-label="Следующий период" onclick="analyticsMove(1)">›</button></section><section class="analytics-summary"><small>Доходы за ${yearly?'год':'месяц'}</small><div class="big">${money(inc)}</div>${row('Расходы',money(exp))}${row('Остаток',money(rest))}${row('Доля остатка',`<span class="analytics-ratio">${ratio.toLocaleString('ru-RU',{maximumFractionDigits:1})}%</span>`)}${bar(ratio)}</section>`;
if(yearly){let max=Math.max(1,...ms.map(x=>Math.max(x.i,x.f+x.d))),step0=max/3,pow=10**Math.floor(Math.log10(step0)),step=[1,2,2.5,5,10].map(v=>v*pow).find(v=>v>=step0)||10*pow,top=step*3,scale=v=>Math.max(0,v)/top*135,short=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];let svg=`<svg class="analytics-chart" viewBox="0 0 340 185" role="img" aria-label="Доходы и расходы по месяцам">${[0,1,2,3].map(i=>{let v=i*step,yy=155-scale(v);return `<line class="gridline" x1="30" x2="335" y1="${yy}" y2="${yy}"/><text x="26" y="${yy+3}" text-anchor="end">${v>=1000?Number((v/1000).toPrecision(3))+'к':Number(v.toPrecision(3))}</text>`}).join('')}${ms.map((x,i)=>{let xx=34+i*25,ih=scale(x.i),eh=scale(x.f+x.d);return `<rect class="income" x="${xx}" y="${155-ih}" width="10" height="${ih}" rx="2"/><rect class="expense" x="${xx+11}" y="${155-eh}" width="10" height="${eh}" rx="2"/><text x="${xx+10}" y="175" text-anchor="middle" ${i===chosen?'font-weight="bold"':''}>${short[i]}</text><rect class="month-hit" x="${xx-2}" y="10" width="25" height="170" onclick="analyticsPick(${i})"/>`}).join('')}</svg>`;let x=ms[chosen];html+=`<section><h2>Динамика финансов</h2><div class="analytics-legend"><span><i style="background:var(--accent)"></i>Доходы</span><span><i style="background:#c49e94"></i>Расходы</span></div>${svg}<div class="analytics-select"><small>Выбери месяц</small><select aria-label="Месяц детализации" onchange="analyticsPick(this.value)">${analyticsMonths.map((n,i)=>`<option value="${i}" ${i===chosen?'selected':''}>${n}</option>`).join('')}</select></div><div class="analytics-detail"><strong>${analyticsMonths[chosen]}</strong>${row('Доходы',money(x.i))}${row('Расходы',money(x.f+x.d))}</div></section><section class="analytics-average"><h2>Итоги года</h2>${row('Средний доход в месяц',money(active?inc/active:0))}${row('Средний расход в месяц',money(active?exp/active:0))}${row('Месяцев с операциями',active+' из 12')}<small>Средние значения по месяцам с операциями</small></section>`;
}else{let cats=[...new Set(cur.a.filter(o=>o.type!=='income').map(o=>o.category))],colors=['#a8c5b2','#b4b1c9','#c49e94','#9da9b7','#d1bd91'];html+=`<section><h2>Расходы по категориям</h2>${cats.map((k,i)=>{let v=sum(cur.a.filter(o=>o.type!=='income'&&o.category===k));return `<div class="analytics-category">${row(esc(k),money(v))}<div class="bar"><i style="background:${colors[i%colors.length]};width:${exp?Math.max(0,Math.min(100,v/exp*100)):0}%"></i></div></div>`}).join('')||'Нет расходов'}</section>`}return html}

let analysisPeriod='month',categoryType='income';const categoryIcons=['◇','₽','⌂','♧','☕','✈','♡','★','♫','⚑','◎','▣','⚙','☀','✚','♬'];function categoryList(type){return Array.isArray(state.customCategories?.[type])?state.customCategories[type]:cats[type].map(name=>({name,icon:'◇'}))}function categoryScreen(){let list=categoryList(categoryType);return `<button onclick="openHomeTab(6)">‹ Настройки</button><section><div class="row"><h2>Мои категории</h2><button class="primary" onclick="editCategory(-1)">＋</button></div>${typePicker(categoryType).replaceAll('name="type"','name="categoryType" onchange="categoryType=this.value;render()"')}<small>${list.length} категорий</small>${list.map((c,i)=>`<div class="item action-row category-action-row"><span class="cat-icon">${esc(c.icon)}</span><span class="cat-name">${esc(c.name)}</span>${actionPair(`editCategory(${i})`,`deleteCategory(${i})`)}</div>`).join('')}<button onclick="editCategory(-1)">＋ Добавить категорию</button></section>`}function storeCategories(list){state.customCategories={...state.customCategories,[categoryType]:list}}function editCategory(i){let list=categoryList(categoryType).slice(),old=list[i];modal(old?'Редактирование категории':'Новая категория',field('Название','name',old?.name||'')+select('Значок','icon',categoryIcons.map(x=>[x,x]),old?.icon||'◇'),v=>{let name=v.name.trim();if(!name||list.some((c,j)=>j!==i&&c.name.toLowerCase()===name.toLowerCase())){alert('Введите уникальное название');throw new Error('Invalid category')}let item={name,icon:v.icon};if(old){list[i]=item;state.ops.forEach(o=>{if(o.type===categoryType&&o.category===old.name)o.category=name})}else list.push(item);storeCategories(list)})}function deleteCategory(i){let list=categoryList(categoryType).slice();if(!confirm('Удалить категорию из списка? Старые операции сохранятся.'))return;list.splice(i,1);storeCategories(list);save();render()}
function dailyBudget(c){let running=0;const rows=Array.from({length:c.days},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0'),ops=c.a.filter(o=>o.type==='daily'&&o.date===date),spent=sum(ops);running+=spent;const balance=(i+1)*c.b-running;return `<tr class="${date>today()?'future':''}"><td>${date.slice(8)}.${date.slice(5,7)}</td><td>${ops.map(o=>esc(o.name||o.category)).join('<br>')||'—'}</td><td>${ops.length?ops.map(o=>money(o.amount)).join('<br>'):'—'}</td><td class="${balance<0?'negative':'positive'}">${money(balance)}</td></tr>`}).join('');return `<section><h2>Ежедневный бюджет</h2><small>Бюджет на день</small><div class="big">${money(c.b)}</div>${row('Доступно на месяц',money(c.i-c.f-c.p))}${row('Потрачено за месяц',money(c.d))}${row('Остаток на конец месяца',money(c.i-c.f-c.p-c.d))}</section><section><small>Будущие дни — прогноз. Остаток начинается с нуля каждый месяц.</small><table class="daily-table"><thead><tr><th>Дата</th><th>Пояснение</th><th>Сумма</th><th>Остаток</th></tr></thead><tbody>${rows}</tbody></table></section>`}
function renderNav(){let groups=[['ОСНОВНОЕ',[[0,'Главная',0],[1,'Бюджет',1],[7,'Ежедневный бюджет',9],[5,'Календарь',5]]],['ФИНАНСЫ',[[2,'Аналитика',2],[3,'Цели',3],[4,'Капитал',4]]],['УПРАВЛЕНИЕ',[[9,'История операций',5],[6,'Настройки',6]]]];$('nav').innerHTML=`<div class="row"><div>${ico(1)} <strong>Мой капитал</strong><br><small>Личные финансы</small></div><button onclick="menu(false)" aria-label="Закрыть">×</button></div>`+groups.map(([label,items])=>`<div class="group-label">${label}</div>`+items.map(([i,n,ic])=>`<button class="${tab===i?'active':''}" onclick="openHomeTab(${i})">${ico(ic)}${n}</button>`).join('')).join('')+`<div class="footer"><button onclick="state.hideAmounts=!state.hideAmounts;save();render()"><span class="eye-hit">${eye()}</span>${state.hideAmounts?'Показать суммы':'Скрыть суммы'}</button><div class="theme-options">${[['light','Светлая'],['dark','Тёмная'],['auto','Авто']].map(([k,n])=>`<button class="${state.theme===k?'active':''}" onclick="state.theme='${k}';save();theme();render()">${n}</button>`).join('')}</div><small>Мой капитал · v.0.3.3</small></div>`;document.body.classList.toggle('masked',!!state.hideAmounts)}let touchStart=null;document.addEventListener('touchstart',e=>{if(e.touches.length===1&&!dlg.open)touchStart=[e.touches[0].clientX,e.touches[0].clientY];else touchStart=null},{passive:true});document.addEventListener('touchend',e=>{if(!touchStart)return;let t=e.changedTouches[0],dx=t.clientX-touchStart[0],dy=t.clientY-touchStart[1],open=$('nav').classList.contains('open');if(Math.abs(dy)<70){if(!open&&touchStart[0]<35&&dx>85)menu(true);if(open&&dx< -85)menu(false)}touchStart=null},{passive:true});matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>{if(state.theme==='auto')theme()});
function menu(open){$('nav').classList.toggle('open',open);$('shade').hidden=!open;$('menuButton').setAttribute('aria-expanded',String(open));$('nav').inert=!open;document.body.style.overflow=open?'hidden':''}function ico(i){let paths=['M3 10 12 3l9 7v11h-6v-7H9v7H3z','M3 5h18v14H3z M3 9h18 M15 14h3','M4 20V10 M10 20V4 M16 20v-7 M22 20V7','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8','M3 9l9-6 9 6 M5 10v8 M12 10v8 M19 10v8 M3 21h18','M3 5h18v16H3z M7 3v4 M17 3v4 M3 10h18','M4 7h16 M4 12h16 M4 17h16 M8 5v4 M16 10v4 M10 15v4','M3 6h18 M3 12h18 M3 18h18','M12 3a9 9 0 1 0 0 18z','M3 4h18v16H3z M3 9h18 M3 14h18 M9 4v16 M15 4v16'];return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[i]}"/></svg>`}function calendar(){let c=calc(month),offset=(new Date(+month.slice(0,4),+month.slice(5)-1,1).getDay()+6)%7;if(!selectedDay.startsWith(month))selectedDay=month+'-01';let events=d=>[...state.ops.filter(o=>o.date===d),...state.payments.filter(o=>o.date===d)];return `<section><h2>Финансовый календарь</h2><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:c.days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0');return `<button class="${d===selectedDay?'selected':''}" onclick="selectedDay='${d}';render()">${i+1}${events(d).length?'<span class="dot">●</span>':''}</button>`}).join('')}</div><h2>${selectedDay}</h2>${events(selectedDay).map(o=>row(esc(o.name),money(o.amount))).join('')||'Нет событий'}</section>`}function snapshot(){let value=sum(state.capital.filter(x=>x.type==='asset'))-sum(state.capital.filter(x=>x.type==='debt'));state.history=state.history.filter(x=>x.date!==today());state.history.push({date:today(),value})}function historyChart(){let h=state.history.slice().sort((a,b)=>a.date.localeCompare(b.date)),lo=Math.min(...h.map(x=>x.value)),hi=Math.max(...h.map(x=>x.value)),pts=h.map((x,i)=>`${10+i*280/Math.max(1,h.length-1)},${110-90*(x.value-lo)/Math.max(1,hi-lo)}`).join(' ');return `<section><h2>История капитала</h2>${h.length>1?`<svg viewBox="0 0 300 120" width="100%"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>`:'График появится после изменений капитала в разные дни.'}${h.slice(-5).reverse().map(x=>row(esc(x.date),money(x.value))).join('')}</section>`}

function rate(v){state.rates[month]=Math.min(100,Math.max(0,Number(v)||0));save();render()}function remove(k,id){if(confirm('Удалить запись?')){state[k]=state[k].filter(o=>o.id!==id);if(k==='capital')snapshot();save();render()}}const field=(label,name,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${extra}></label>`;const select=(label,name,values,v)=>`<label>${label}<select name="${name}">${values.map(([k,t])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;function modal(title,html,fn){$('formTitle').textContent=title;$('fields').innerHTML=html;$('entry').onsubmit=e=>{e.preventDefault();try{fn(Object.fromEntries(new FormData(e.target)))}catch{return}save();dlg.close();render()};dlg.showModal()}function put(k,o,id){o.id=id||uid();state[k]=state[k].filter(x=>x.id!==o.id);state[k].push(o);if(k==='capital')snapshot()}function typePicker(type){return `<div class="type-picker" role="group" aria-label="Тип операции">${[['income','Доход','M18 6L6 18 M6 10v8h8'],['fixed','Обязательный','M3 5h18v16H3z M7 3v4 M17 3v4 M3 10h18 M8 15l3 3 5-5'],['daily','Ежедневный','M4 8h16l1 13H3z M8 8V6a4 4 0 0 1 8 0v2']].map(([key,label,path])=>`<label><input type="radio" name="type" value="${key}" ${key===type?'checked':''}><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${path}"/></svg>${label}</span></label>`).join('')}</div>`}function operation(id){let o=state.ops.find(x=>x.id===id)||{},type=o.type||'daily';modal(id?'Редактирование операции':'Новая операция',typePicker(type)+`<div id="catfield"></div>`+field('Описание','name',o.name||'')+field('Сумма','amount',o.amount||'','number','min="0.01" step="0.01"')+field('Дата','date',o.date||(month===today().slice(0,7)?today():month+'-01'),'date'),v=>put('ops',{...v,amount:+v.amount},id));let t=$('entry').elements.type;function categories(){let a=categoryList(t.value).map(x=>x.name);if(t.value===o.type&&o.category&&!a.includes(o.category))a.push(o.category);$('catfield').innerHTML=select('Категория','category',a.map(x=>[x,x]),t.value===o.type?o.category:undefined)}$('entry').querySelectorAll('input[name=type]').forEach(r=>r.addEventListener('change',categories));categories()}let goalPhoto='';function clearPhoto(el){goalPhoto='';el.textContent='Фото удалено'}function loadPhoto(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,640/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);goalPhoto=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}function goal(id){let o=state.goals.find(x=>x.id===id)||{};modal('Финансовая цель',field('Название','name',o.name)+field('Целевая сумма','target',o.target,'number','min="1" step="0.01"')+field('Накоплено','amount',o.amount??0,'number','min="0" step="0.01"')+field('Срок','date',o.date||today(),'date'),v=>put('goals',{...v,photo:goalPhoto,amount:+v.amount,target:+v.target},id));goalPhoto=o.photo||''; $('fields').insertAdjacentHTML('beforeend',select('Значок','icon',['◎','⌂','✈','♡','★','⚑','♧'].map(x=>[x,x]),o.icon||'◎')+'<label>Фото цели<input type="file" accept="image/*" onchange="loadPhoto(this)"></label><button type="button" onclick="clearPhoto(this)">Убрать фото</button>')}function capital(id){let o=state.capital.find(x=>x.id===id)||{};modal('Капитал',select('Тип','type',[['asset','Актив'],['debt','Обязательство']],o.type||'asset')+'<div id="capcat"></div>'+field('Сумма','amount',o.amount,'number','min="0" step="0.01"'),v=>put('capital',{...v,amount:+v.amount},id));let t=$('entry').elements.type;function cc(){$('capcat').innerHTML=select('Категория','name',cats[t.value].map(x=>[x,x]),o.name)}t.onchange=cc;cc()}function payment(){modal('Платёж',field('Название','name')+field('Сумма','amount','','number','min="0.01" step="0.01"')+field('Дата','date',today(),'date')+select('Повтор','repeat',[['no','Нет'],['yes','Ежемесячно']],'no'),v=>put('payments',{...v,amount:+v.amount,repeat:v.repeat==='yes'}))}function paid(id){let p=state.payments.find(x=>x.id===id);if(!confirm('Записать платёж как обязательный расход?'))return;put('ops',{type:'fixed',category:'Другое 1',name:p.name,amount:p.amount,date:today()});if(p.repeat){let [y,m,d]=p.date.split('-').map(Number),next=new Date(y,m,1),last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();p.date=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}else state.payments=state.payments.filter(x=>x.id!==id);save();render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('capital.json',JSON.stringify(state,null,2),'application/json')}function csv(){let q=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('capital.csv','\ufeff'+[['Дата','Тип','Категория','Описание','Сумма'],...state.ops.map(o=>[o.date,o.type,o.category,o.name,o.amount])].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if(!['ops','goals','capital','payments'].every(k=>Array.isArray(s[k])&&s[k].every(o=>typeof o.id==='string'&&/^[\w.-]+$/.test(o.id)&&Number.isFinite(o.amount)))||!s.rates||typeof s.rates!=='object'||!s.ops.every(o=>typeof o.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)))throw Error();if(confirm('Заменить текущие данные резервной копией?')){state=s;state.history=Array.isArray(state.history)?state.history:[];save();render()}}catch{alert('Некорректная копия')}}$('month').onchange=e=>{if(e.target.value){month=e.target.value;render()}};function theme(){document.body.classList.toggle('light',state.theme==='light'||state.theme==='auto'&&matchMedia('(prefers-color-scheme:light)').matches)}$('theme').onclick=togglePrivacy;theme();menu(false);render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
