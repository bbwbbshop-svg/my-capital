<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122b29"><link rel="manifest" href="manifest.json"><title>Мой капитал</title><style>
:root{color-scheme:dark;--bg:#101e23;--fg:#f1faf7;--glass:#ffffff13;--line:#ffffff24;--accent:#83e6bc}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:radial-gradient(ellipse at top left,#24564e,transparent 65%),var(--bg);color:var(--fg);min-height:100vh}body.light{color-scheme:light;--bg:#edf5f3;--fg:#17352f;--glass:#ffffffa8;--line:#244d4320;--accent:#087b58;background:radial-gradient(ellipse at top left,#b9e4d8,transparent 65%),var(--bg)}main{max-width:700px;margin:auto;padding:24px 16px 115px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:30px;margin:8px 0 20px}h2{font-size:19px}small{opacity:.75}section,nav{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0;backdrop-filter:blur(24px);box-shadow:0 8px 30px #0000000b}.big{font-size:36px;font-weight:700;letter-spacing:-1px;color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid section{margin:0;padding:14px}button,input,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:12px;min-width:0}button{cursor:pointer}button.primary{background:var(--accent);color:#12342b;font-weight:700;border:0}input,select{width:100%;margin:5px 0 10px}label{display:block;font-size:13px;opacity:.85}nav{position:fixed;bottom: max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(96%,700px);display:flex;justify-content:space-around;padding:7px;margin:0;background:var(--bg);z-index:2}nav button{border:0;background:none;padding:8px 4px;font-size:11px;flex:1}nav b{display:block;font-size:20px}nav .active{color:var(--accent);background:var(--glass)}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.negative{color:#ed8989}.bar{height:9px;background:var(--line);border-radius:20px;overflow:hidden}.bar i{display:block;background:var(--accent);height:100%}dialog{width:min(94%,480px);border:1px solid var(--line);border-radius:24px;background:var(--bg);color:var(--fg);padding:22px}dialog::backdrop{background:#0008} .muted{opacity:.7}button.danger{color:#ed8989} </style><main><header><small>ЛИЧНЫЕ ФИНАНСЫ</small><button id="theme" aria-label="Сменить тему">◐</button></header><h1>Мой капитал</h1><input type="month" id="month" aria-label="Месяц"><div id="view"></div></main><nav id="nav"></nav><dialog id="dlg"><form id="entry"><h2 id="formTitle">Новая операция</h2><div id="fields"></div><button class="primary" type="submit">Сохранить</button> <button type="button" onclick="dlg.close()">Отмена</button></form></dialog><script src="categories.js"></script><script>
const $=id=>document.getElementById(id), view=$('view'),dlg=$('dlg');const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state={ops:[],rates:{},goals:[],capital:[],payments:[],theme:'auto'};try{Object.assign(state,JSON.parse(localStorage.getItem('capital-v1')||'{}'))}catch{}let tab=0,month=today().slice(0,7);$('month').value=month;const save=()=>localStorage.setItem('capital-v1',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';const sum=a=>a.reduce((s,o)=>s+Number(o.amount),0);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function calc(m){let a=state.ops.filter(o=>o.date.startsWith(m)),i=sum(a.filter(o=>o.type==='income')),f=sum(a.filter(o=>o.type==='fixed')),d=sum(a.filter(o=>o.type==='daily')),p=i*(state.rates[m]??10)/100,days=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return {a,i,f,d,p,days,b:(i-f-p)/days,r:i-f-d}}const tile=(label,n)=>`<section><small>${label}</small><h2>${money(n)}</h2></section>`;const row=(a,b)=>`<div class="row item"><span>${a}</span><strong>${b}</strong></div>`;const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;function render(){let c=calc(month),day=month===today().slice(0,7)?+today().slice(-2):month<today().slice(0,7)?c.days:0;let spent=sum(c.a.filter(o=>o.type==='daily'&&+o.date.slice(-2)<=day));let html='';if(tab===0){html=`<section><small>Остаток после расходов</small><div class="big">${money(c.r)}</div>${row('Доходы',money(c.i))}${row('Расходы',money(c.f+c.d))}</section><div class="grid">${tile('Бюджет на день',c.b)}${tile('Сальдо на сегодня',c.b*day-spent)}${tile('План накоплений',c.p)}${tile('Отклонение от плана',c.r-c.p)}</div><section><h2>Ближайшие платежи</h2>${state.payments.filter(p=>p.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(p=>row(esc(p.name)+' · '+p.date,money(p.amount))).join('')||'Нет платежей'}</section><button class="primary" onclick="operation()">＋ Добавить операцию</button>`}if(tab===1){html=`<section><h2>План месяца</h2><label>Процент накоплений</label><input type="number" min="0" max="100" value="${state.rates[month]??10}" onchange="rate(this.value)">${row('Доходы',money(c.i))}${row('Обязательные расходы',money(c.f))}${row('Ежедневные расходы',money(c.d))}</section><button class="primary" onclick="operation()">＋ Операция</button><section><h2>Операции</h2>${c.a.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<div class="item row"><div>${esc(o.name)}<br><small>${o.date} · ${esc(o.category)}</small></div><strong>${o.type==='income'?'+':'−'}${money(o.amount)}</strong><button onclick="operation('${o.id}')">✎</button><button onclick="remove('ops','${o.id}')">×</button></div>`).join('')||'Пока нет операций'}</section>`}if(tab===2){let year=month.slice(0,4),months=Array.from({length:12},(_,i)=>calc(year+'-'+String(i+1).padStart(2,'0'))),total=k=>months.reduce((s,m)=>s+m[k],0);html=`<section><h2>Годовая сводка · ${year}</h2>${row('Доходы',money(total('i')))}${row('Расходы',money(total('f')+total('d')))}${row('Остаток',money(total('r')))}${row('Доля остатка',total('i')?(100*total('r')/total('i')).toFixed(1)+'%':'0%')}</section><section><h2>Расходы по месяцам</h2>${months.map((m,i)=>`<div class="item">${new Date(2026,i,1).toLocaleString('ru',{month:'long'})} · ${money(m.f+m.d)}${bar(100*(m.f+m.d)/Math.max(1,...months.map(x=>x.f+x.d)))}</div>`).join('')}</section><section><h2>Категории месяца</h2>${[...new Set(c.a.filter(o=>o.type!=='income').map(o=>o.category))].map(k=>row(esc(k),money(sum(c.a.filter(o=>o.type!=='income'&&o.category===k))))).join('')}</section>`}if(tab===3){html=`<button class="primary" onclick="goal()">＋ Цель</button>${state.goals.map(g=>`<section><h2>${esc(g.name)}</h2><div class="big">${money(g.amount)}</div><small>из ${money(g.target)} · до ${g.date}</small>${bar(100*g.amount/g.target)}${row('Осталось',money(Math.max(0,g.target-g.amount)))}<button onclick="goal('${g.id}')">Изменить</button> <button onclick="remove('goals','${g.id}')">Удалить</button></section>`).join('')||'<section>Добавь первую финансовую цель.</section>'}`}if(tab===4){let a=sum(state.capital.filter(x=>x.type==='asset')),b=sum(state.capital.filter(x=>x.type==='debt'));html=`<section><small>Чистый капитал</small><div class="big">${money(a-b)}</div>${row('Активы',money(a))}${row('Обязательства',money(b))}</section><button class="primary" onclick="capital()">＋ Актив / долг</button><section>${state.capital.map(o=>`<div class="row item">${esc(o.name)} ${money(o.amount)}<button onclick="capital('${o.id}')">✎</button><button onclick="remove('capital','${o.id}')">×</button></div>`).join('')}</section>`}if(tab===5){html=`<button class="primary" onclick="payment()">＋ Платёж</button><section><h2>Календарь платежей</h2>${state.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<div class="item"><div class="row"><strong>${esc(p.name)}</strong>${money(p.amount)}</div><small>${p.date} · ${p.repeat?'ежемесячно':'разовый'}</small><div><button onclick="paid('${p.id}')">Оплачен</button> <button onclick="remove('payments','${p.id}')">Удалить</button></div></div>`).join('')||'Нет платежей'}</section>`}if(tab===6){html=`<section><h2>Данные</h2><button onclick="backup()">Резервная копия JSON</button> <button onclick="csv()">Экспорт CSV для Excel</button><label>Восстановить из JSON</label><input type="file" accept=".json" onchange="restore(this)"><p class="muted">Данные хранятся в этом браузере. Синхронизация и защита пока не подключены.</p></section>`}view.innerHTML=html;$('nav').innerHTML=['⌂|Главная','▤|Бюджет','▥|Анализ','◎|Цели','◇|Капитал','▦|Платежи','⚙|Ещё'].map((s,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()"><b>${s.split('|')[0]}</b>${s.split('|')[1]}</button>`).join('')}
function rate(v){state.rates[month]=Math.min(100,Math.max(0,Number(v)||0));save();render()}function remove(k,id){if(confirm('Удалить запись?')){state[k]=state[k].filter(o=>o.id!==id);save();render()}}const field=(label,name,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${extra}></label>`;const select=(label,name,values,v)=>`<label>${label}<select name="${name}">${values.map(([k,t])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;function modal(title,html,fn){$('formTitle').textContent=title;$('fields').innerHTML=html;$('entry').onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target)));save();dlg.close();render()};dlg.showModal()}function put(k,o,id){o.id=id||uid();state[k]=state[k].filter(x=>x.id!==o.id);state[k].push(o)}function operation(id){let o=state.ops.find(x=>x.id===id)||{},type=o.type||'daily';modal('Операция',select('Тип','type',[['income','Доход'],['fixed','Обязательный расход'],['daily','Ежедневный расход']],type)+`<div id="catfield"></div>`+field('Описание','name',o.name||'')+field('Сумма','amount',o.amount||'','number','min="0.01" step="0.01"')+field('Дата','date',o.date||(month===today().slice(0,7)?today():month+'-01'),'date'),v=>put('ops',{...v,amount:+v.amount},id));let t=$('entry').elements.type;function categories(){let a=cats[t.value==='daily'?'fixed':t.value];$('catfield').innerHTML=select('Категория','category',a.map(x=>[x,x]),o.category)}t.onchange=categories;categories()}function goal(id){let o=state.goals.find(x=>x.id===id)||{};modal('Финансовая цель',field('Название','name',o.name)+field('Целевая сумма','target',o.target,'number','min="1" step="0.01"')+field('Накоплено','amount',o.amount??0,'number','min="0" step="0.01"')+field('Срок','date',o.date||today(),'date'),v=>put('goals',{...v,amount:+v.amount,target:+v.target},id))}function capital(id){let o=state.capital.find(x=>x.id===id)||{};modal('Капитал',select('Тип','type',[['asset','Актив'],['debt','Обязательство']],o.type||'asset')+'<div id="capcat"></div>'+field('Сумма','amount',o.amount,'number','min="0" step="0.01"'),v=>put('capital',{...v,amount:+v.amount},id));let t=$('entry').elements.type;function cc(){$('capcat').innerHTML=select('Категория','name',cats[t.value].map(x=>[x,x]),o.name)}t.onchange=cc;cc()}function payment(){modal('Платёж',field('Название','name')+field('Сумма','amount','','number','min="0.01" step="0.01"')+field('Дата','date',today(),'date')+select('Повтор','repeat',[['no','Нет'],['yes','Ежемесячно']],'no'),v=>put('payments',{...v,amount:+v.amount,repeat:v.repeat==='yes'}))}function paid(id){let p=state.payments.find(x=>x.id===id);if(!confirm('Записать платёж как обязательный расход?'))return;put('ops',{type:'fixed',category:'Другое 1',name:p.name,amount:p.amount,date:today()});if(p.repeat){let [y,m,d]=p.date.split('-').map(Number),next=new Date(y,m,1),last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();p.date=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}else state.payments=state.payments.filter(x=>x.id!==id);save();render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('capital.json',JSON.stringify(state,null,2),'application/json')}function csv(){let q=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('capital.csv','\ufeff'+[['Дата','Тип','Категория','Описание','Сумма'],...state.ops.map(o=>[o.date,o.type,o.category,o.name,o.amount])].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if(!['ops','goals','capital','payments'].every(k=>Array.isArray(s[k])&&s[k].every(o=>typeof o.id==='string'&&/^[\w.-]+$/.test(o.id)&&Number.isFinite(o.amount)))||!s.rates||typeof s.rates!=='object'||!s.ops.every(o=>typeof o.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)))throw Error();if(confirm('Заменить текущие данные резервной копией?')){state=s;save();render()}}catch{alert('Некорректная копия')}}$('month').onchange=e=>{if(e.target.value){month=e.target.value;render()}};function theme(){document.body.classList.toggle('light',state.theme==='light'||state.theme==='auto'&&matchMedia('(prefers-color-scheme:light)').matches)}$('theme').onclick=()=>{state.theme=document.body.classList.contains('light')?'dark':'light';save();theme()};theme();render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
