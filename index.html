let analysisPeriod='month',categoryType='income';const categoryIcons=['◇','₽','⌂','♧','☕','✈','♡','★','♫','⚑','◎','▣','⚙','☀','✚','♬'];function categoryList(type){return Array.isArray(state.customCategories?.[type])?state.customCategories[type]:cats[type].map(name=>({name,icon:'◇'}))}function categoryScreen(){let list=categoryList(categoryType);return `<button onclick="openHomeTab(6)">‹ Настройки</button><section><div class="row"><h2>Мои категории</h2><button class="primary" onclick="editCategory(-1)">＋</button></div>${typePicker(categoryType).replaceAll('name="type"','name="categoryType" onchange="categoryType=this.value;render()"')}<small>${list.length} категорий</small>${list.map((c,i)=>`<div class="item action-row category-action-row">${catMark(categoryType,c.name)}<span class="cat-name">${esc(c.name)}</span>${actionPair(`editCategory(${i})`,`deleteCategory(${i})`)}</div>`).join('')}<button onclick="editCategory(-1)">＋ Добавить категорию</button></section>`}function storeCategories(list){state.customCategories={...state.customCategories,[categoryType]:list}}function editCategory(i){let list=categoryList(categoryType).slice(),old=list[i],col=catStyle(categoryType,old?.name).color;modal(old?'Редактирование категории':'Новая категория',`<section id="categoryPreview"></section>`+field('Название','name',old?.name||'')+`<input type="hidden" name="icon" value="${esc(old?.icon||'◇')}"><input type="hidden" name="color" value="${col}"><h2>Цвет категории</h2><div class="palette-grid">${personalColors.map(c=>`<button type="button" data-color="${c}" style="background:${c}" onclick="pickCategory('color',this.dataset.color)"> </button>`).join('')}</div><h2>Значок категории</h2><input placeholder="Поиск значка…" oninput="filterSymbols(this.value)"><div class="symbol-grid">${symbols.map((x,j)=>`<button type="button" data-symbol="${esc(x)}" data-search="${esc(symbolNames[j]+' '+x)}" onclick="pickCategory('icon',this.dataset.symbol)">${esc(x)}</button>`).join('')}</div>`,v=>{let name=v.name.trim();if(!name||list.some((c,j)=>j!==i&&c.name.toLowerCase()===name.toLowerCase())){alert('Введите уникальное название');throw Error()}let item={name,icon:v.icon,color:v.color};if(old){list[i]=item;state.ops.forEach(o=>{if(o.type===categoryType&&o.category===old.name)o.category=name})}else list.push(item);storeCategories(list)});$('entry').elements.name.addEventListener('input',categoryPreview);categoryPreview()}function deleteCategory(i){let list=categoryList(categoryType).slice();if(!confirm('Удалить категорию из списка? Старые операции сохранятся.'))return;list.splice(i,1);storeCategories(list);save();render()}

function balanceMoney(n){return `<span class="balance-value ${state.hideAmounts?'neutral':n>0?'positive':n<0?'negative':'neutral'}">${money(n)}</span>`}
function dailyMetrics(c,day){let date=month+'-'+String(day).padStart(2,'0'),spent=sum(c.a.filter(o=>o.type==='daily'&&o.date===date)),prior=sum(c.a.filter(o=>o.type==='daily'&&o.date<date)),carry=day>0?(day-1)*c.b-prior:0,limit=day>0?c.b:0,remaining=limit-spent;return {spent,carry,limit,remaining,available:remaining+carry}}
function dailyGauge(c,day,home=false){let p=dailyPrefs(),m=dailyMetrics(c,day),hidden=state.hideAmounts,ratio=m.limit>0?Math.max(0,Math.min(1,m.remaining/m.limit)):0,cls=hidden?'neutral':m.remaining<0?'negative':m.remaining>0?'positive':'neutral',fill=m.remaining<0?1:ratio, title=month===today().slice(0,7)?'Бюджет на сегодня':day?'Бюджет на '+String(day).padStart(2,'0')+'.'+month.slice(5):'Будущий месяц',arc='M 30 180 A 130 130 0 0 1 290 180',paths=home?`<path d="${arc}" class="gauge-track" stroke-width="20" stroke-linecap="round"/>${!hidden&&fill>0?`<path d="${arc}" class="gauge-fill ${cls}" stroke-width="20" stroke-linecap="round" pathLength="100" stroke-dasharray="${fill*100} 100"/>`:''}`:Array.from({length:36},(_,i)=>{let a=Math.PI+i*Math.PI/36,b=Math.PI+(i+.78)*Math.PI/36;return `<path d="M ${160+130*Math.cos(a)} ${180+130*Math.sin(a)} A 130 130 0 0 1 ${160+130*Math.cos(b)} ${180+130*Math.sin(b)}" class="${!hidden&&i<Math.ceil(fill*36)?'gauge-fill '+cls:'gauge-track'}" stroke-width="17"/>`}).join('');let status=m.available<0?'Общий доступный бюджет превышен':m.remaining<0?'Дневной лимит превышен, используется перенос':m.remaining===0?'Дневной лимит исчерпан':'Ты укладываешься в дневной бюджет';return `<section class="daily-gauge ${home?'home-link':''} ${p.animate?'gauge-animate':''}" ${home?'role="button" tabindex="0" onclick="openHomeTab(7)" onkeydown="homeKey(event,7)"':''}><div class="row"><h2>${title}</h2>${home?'›':ico(1)}</div><div class="gauge-wrap"><svg viewBox="0 0 320 205" aria-hidden="true">${paths}</svg><div class="gauge-center"><small>${home?'Осталось':'Осталось из лимита дня'}</small><div class="gauge-number">${balanceMoney(m.remaining)}</div>${!home&&p.percent&&!hidden&&m.limit>0?`<small>${Math.round(m.spent/m.limit*100)}% лимита потрачено</small>`:''}</div></div>${home?(p.carry?`<small>С учётом переноса</small><div class="big">${balanceMoney(m.available)}</div>`:''):`${row('Лимит на день',balanceMoney(m.limit))}${row('Потрачено сегодня',money(m. function histDetail(id){let o=state.ops.find(x=>x.id===id);if(!o)return;modal('Операция',`<section><small>${esc(o.category)}</small><div class="big">${money(o.amount)}</div><h2>${esc(o.name)}</h2>${row('Дата',esc(o.date))}${row('Комментарий',esc(o.note||'—'))}</section>${o.calendarKey&&histPrefs().link?`<button type="button" onclick="histCalendar('${id}')">Связано с календарём ›</button>`:''}<button type="button" onclick="dlg.close();operation('${id}')">Редактировать</button>`,()=>{})}

function histSettings(){let p=histPrefs();modal('Настройки истории',select('Период при открытии','period',[['all','За всё время'],['month','Текущий месяц'],['30','Последние 30 дней']],p.period)+[['remember','Запоминать фильтры'],['group','Группировать по дням'],['summary','Показывать финансовую сводку'],['chart','Показывать структуру расходов'],['link','Показывать связь с календарём']].map(([k,n])=>`<label><input type="checkbox" name="${k}" ${p[k]?'checked':''}> ${n}</label>`).join(''),v=>{p.period=v.period;for(let k of ['remember','group','summary','chart','link'])p[k]=!!v[k];if(!p.remember){delete state.histFilters;hf={}}})}


const personalCards=[['budget','Бюджет',1],['payments','Ближайшие платежи',5],['daily','Ежедневный бюджет',9],['goals','Финансовые цели',3],['capital','Чистый капитал',4],['analytics','Аналитика расходов',2]];
const schemes=[['Шалфей','#a8c5b2','#202923','#edf3ec','#52775e'],['Океан','#a7b9d1','#202731','#edf1f7','#47678b'],['Лаванда','#c4b1d3','#292431','#f3eef7','#79578e'],['Песок','#cbb49b','#2d2924','#f5f0e9','#85633e'],['Графит','#b7c1c8','#25292d','#eff1f3','#52636e'],['Роза','#d6b1b5','#302528','#f8eef0','#925963']];

function personal(){let p=state.personal??={};p.order=[...new Set([...(Array.isArray(p.order)?p.order:[]),...personalCards.map(x=>x[0])])].filter(k=>personalCards.some(x=>x[0]===k));p.hidden=Array.isArray(p.hidden)?p.hidden:['daily','goals','capital','analytics'];p.scheme=Number.isInteger(p.scheme)&&schemes[p.scheme]?p.scheme:0;return p}
function applyPalette(){let p=schemes[personal().scheme],l=document.body.classList.contains('light'),b=document.body.style;b.setProperty('--bg',p[l?3:2]);b.setProperty('--accent',p[l?4:1]);b.setProperty('--onaccent',l?'#fff':'#26392e');b.setProperty('--fg',l?'#34443d':'#edf1eb');document.querySelector('meta[name=theme-color]').content=p[l?3:2]}
function personalChange(k,v){personal()[k]=v;save();render()}
function personalToggle(k){let p=personal();personalChange('hidden',p.hidden.includes(k)?p.hidden.filter(x=>x!==k):[...p.hidden,k])}
function personalHome(c,day,spent){let p=personal(),cards={budget: `<div class="home-group" role="button" tabindex="0" aria-label="Открыть бюджет" onclick="openHomeTab(1)" onkeydown="homeKey(event,1)"><div class="row group-title"><span>Бюджет</span><span aria-hidden="true">›</span></div><section><small>Остаток после расходов</small><div class="big">${balanceMoney(c.r)}</div>${row('Доходы',money(c.i))}${row('Расходы',money(c.f+c.d))}</section><div class="grid">${tile('Бюджет на день',c.b)}${tile('Сальдо на сегодня',c.b*day-spent)}${tile('План накоплений',c.p)}${tile('Отклонение от плана',c.r-c.p)}</div></div>`,payments:`<section class="home-link" role="button" tabindex="0" aria-label="Открыть календарь" onclick="openHomeTab(5)" onkeydown="homeKey(event,5)"><div class="row group-title"><h2>Ближайшие платежи</h2><span aria-hidden="true">›</span></div>${calHome()}</section>`,daily:dailyGauge(c,day,true),goals:goalHome(),capital:`<section class="home-link" onclick="openHomeTab(4)"><div class="row"><h2>Чистый капитал</h2>›</div><div class="big">${balanceMoney(sum(state.capital.filter(x=>x.type==='asset'))-sum(state.capital.filter(x=>x.type==='debt')))}</div></section>`,analytics:`<section class="home-link" onclick="openHomeTab(2)"><div class="row"><h2>Аналитика расходов</h2>›</div><div class="big">${money(c.f+c.d)}</div>${row('Обязательные',money(c.f))}${row('Ежедневные',money(c.d))}</section>`};return p.order.filter(k=>!p.hidden.includes(k)).map(k=>cards[k]).join('')||'<section>Нет активных карточек</section>'}
let personalPreview=false;
function personalScreen(){let p=personal(),c=calc(month),day=month===today().slice(0,7)?+today().slice(-2):month<today().slice(0,7)?c.days:0,spent=sum(c.a.filter(o=>o.type==='daily'&&+o.date.slice(-2)<=day));return `<button onclick="openHomeTab(6)">‹ Настройки</button><section><h2>Главный экран</h2><small>Удерживай ручку и перетаскивай карточки.</small><div class="row"><button class="${!personalPreview?'primary':''}" onclick="personalPreview=false;render()">Настройка</button><button class="${personalPreview?'primary':''}" onclick="personalPreview=true;render()">Предпросмотр</button></div>${personalPreview?`<div class="personal-preview">${personalHome(c,day,spent)}</div>`:`<div id="personalOrder">${p.order.map(k=>{let a=personalCards.find(x=>x[0]===k);return `<div class="personal-row" data-key="${k}">${ico(a[2])}<div style="flex:1">${a[1]}<br><small>${p.hidden.includes(k)?'Скрыто':'Отображается'}</small></div><input type="checkbox" aria-label="Показывать ${a[1]}" ${p.hidden.includes(k)?'':'checked'} onchange="personalToggle('${k}')"><button class="drag-handle" aria-label="Переместить ${a[1]}">⠿</button></div>`}).join('')}</div>`}</section><section><h2>Цветовая схема</h2><div class="scheme-grid">${schemes.map((a,i)=>`<button class="${p.scheme===i?'primary':''}" onclick="personalChange('scheme',${i})"><span class="swatch" style="background:${a[1]}"></span>${a[0]}${p.scheme===i?' ✓':''}</button>`).join('')}</div></section><section><h2>Тема приложения</h2><div class="row">${[['light','Светлая'],['dark','Тёмная'],['auto','Системная']].map(([k,n])=>`<button class="${state.theme===k?'primary':''}" onclick="state.theme='${k}';save();theme();render()">${n}</button>`).join('')}</div><p>Плотность: компактная</p><button class="category-link" onclick="openHomeTab(10)">Мои категории ›</button><button class="category-link" onclick="personalReset()">Сброс оформления ›</button></section>`}
function bindPersonalDrag(){let list=$('personalOrder');if(!list)return;list.querySelectorAll('.drag-handle').forEach(h=>{h.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();let r=h.closest('.personal-row');h.setPointerCapture(e.pointerId);r.classList.add('dragging');h.onpointermove=m=>{let target=[...list.children].find(x=>x!==r&&m.clientY>=x.getBoundingClientRect().top&&m.clientY<=x.getBoundingClientRect().bottom);if(target){let b=target.getBoundingClientRect();list.insertBefore(r,m.clientY<b.top+b.height/2?target:target.nextSibling)}};h.onpointerup=()=>{personal().order=[...list.children].map(x=>x.dataset.key);save();render()};h.onpointercancel=()=>render()}})}
function personalReset(){if(!confirm('Сбросить оформление? Финансовые данные и категории сохранятся.'))return;delete state.personal;state.theme='auto';for(let t of ['income','fixed','daily'])if(state.customCategories?.[t])state.customCategories[t]=state.customCategories[t].map(c=>({...c,icon:'◇',color:personalColors[0]}));save();theme();render()}
function catStyle(t,n){let c=categoryList(t).find(x=>x.name===n)||{};return {icon:c.icon||'◇',color:personalColors.includes(c.color)?c.color:personalColors[0]}}
function catMark(t,n){let c=catStyle(t,n);return `<span class="cat-mark" style="color:${c.color};background:${c.color}26">${esc(c.icon)}</span>`}
function catColor(n){let o=state.ops.find(x=>x.category===n&&x.type!=='income');return catStyle(o?.type||'daily',n).color}
function categoryPreview(){let f=$('entry').elements,ic=f.icon.value,col=f.color.value; $('categoryPreview').innerHTML=`<span class="cat-mark" style="color:${col};background:${col}26">${esc(ic)}</span> ${esc(f.name.value||'Категория')}`;document.querySelectorAll('[data-symbol]').forEach(b=>b.classList.toggle('selected',b.dataset.symbol===ic));document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('selected',b.dataset.color===col))}
function pickCategory(k,v){$('entry').elements[k].value=v;categoryPreview()}
function filterSymbols(v){document.querySelectorAll('[data-symbol]').forEach(b=>b.hidden=!b.dataset.search.toLowerCase().includes(v.toLowerCase()))}
