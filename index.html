</style><main><header><button id="menuButton" aria-label="Меню" onclick="menu(true)">☰</button><small>ЛИЧНЫЕ ФИНАНСЫ</small><button id="theme" aria-label="Сменить тему">◐</button></header><h1>Мой капитал</h1><input type="month" id="month" aria-label="Месяц"><div id="view"></div></main><div id="shade" hidden onclick="menu(false)"></div><nav id="nav" aria-label="Разделы"></nav><button id="fab" class="primary" aria-label="Добавить операцию" onclick="operation()">+</button><dialog id="dlg"><form id="entry"><h2 id="formTitle">Новая операция</h2><div id="fields"></div><button class="primary" type="submit">Сохранить</button> <button type="button" onclick="dlg.close()">Отмена</button></form></dialog><script src="categories.js"></script><script>
const $=id=>document.getElementById(id), view=$('view'),dlg=$('dlg');const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state={ops:[],rates:{},goals:[],capital:[],payments:[],theme:'auto'};try{Object.assign(state,JSON.parse(localStorage.getItem('capital-v1')||'{}'))}catch{}state.history=Array.isArray(state.history)?state.history:[];let selectedDay=today();let tab=0,month=today().slice(0,7);$('month').value=month;const save=()=>localStorage.setItem('capital-v1',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';const sum=a=>a.reduce((s,o)=>s+Number(o.amount),0);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function calc(m){let a=state.ops.filter(o=>o.date.startsWith(m)),i=sum(a.filter(o=>o.type==='income')),f=sum(a.filter(o=>o.type==='fixed')),d=sum(a.filter(o=>o.type==='daily')),p=i*(state.rates[m]??10)/100,days=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return {a,i,f,d,p,days,b:(i-f-p)/days,r:i-f-d}}const tile=(label,n)=>`<section><small>${label}</small><h2>${money(n)}</h2></section>`;const row=(a,b)=>`<div class="row item"><span>${a}</span><strong>${b}</strong></div>`;const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;function render(){let c=calc(month),day=month===today().slice(0,7)?+today().slice(-2):month<today().slice(0,7)?c.days:0;let spent=sum(c.a.filter(o=>o.type==='daily'&&+o.date.slice(-2)<=day));let html='';if(tab===0){html=`<section><small>Остаток после расходов</small><div class="big">${money(c.r)}</div>${row('Доходы',money(c.i))}${row('Расходы',money(c.f+c.d))}</section><div class="grid">${tile('Бюджет на день',c.b)}${tile('Сальдо на сегодня',c.b*day-spent)}${tile('План накоплений',c.p)}${tile('Отклонение от  Цель</button>${state.goals.map(g=>`<section>${g.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(g.photo)?`<img class="goalphoto" src="${esc(g.photo)}" alt="">`:`<span class="goalicon">${esc(g.icon||"◎")}</span>`}<h2>${esc(g.name)}</h2><div class="big">${money(g.amount)}</div><small>из ${money(g.target)} · до ${g.date}</small>${bar(100*g.amount/g.target)}${row('Осталось',money(Math.max(0,g.target-g.amount)))}<button onclick="goal('${g.id}')">Изменить</button> <button onclick="remove('goals','${g.id}')">Удалить</button></section>`).join('')||'<section>Добавь первую финансовую цель.</section>'}`}if(tab===4){let a=sum(state.capital.filter(x=>x.type==='asset')),b=sum(state.capital.filter(x=>x.type==='debt'));html=`<section><small>Чистый капитал</small><div class="big">${money(a-b)}</div>${row('Активы',money(a))}${row('Обязательства',money(b))}</section><button class="primary" onclick="capital()">＋ Актив / долг</button><section>${state.capital.map(o=>`<div class="row item">${esc(o.name)} ${money(o.amount)}<button onclick="capital('${o.id}')">✎</button><button onclick="remove('capital','${o.id}')">×</button></div>`).join('')}</section>`}if(tab===5){html=`<button class="primary" onclick="payment()">＋ Платёж</button><section><h2>Календарь платежей</h2>${state.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<div class="item"><div class="row"><strong>${esc(p.name)}</strong>${money(p.amount)}</div><small>${p.date} · ${p.repeat?'ежемесячно':'разовый'}</small><div><button onclick="paid('${p.id}')">Оплачен</button> <button onclick="remove('payments','${p.id}')">Удалить</button></div></div>`).join('')||'Нет платежей'}</section>`}if(tab===6){html=`<section><h2>Данные</h2><button onclick="backup()">Резервная копия JSON</button> <button onclick="csv()">Экспорт CSV для Excel</button><label>Восстановить из JSON</label><input type="file" accept=".json" onchange="restore(this)"><p class="muted">Данные хранятся в этом браузере. Синхронизация и защита пока не подключены.</p></section>`}view.innerHTML=html;$('nav').innerHTML=`<div class="row"><h2>Мой капитал</h2><button onclick="menu(false)" aria-label="Закрыть">×</button></div>`+['Главная','Бюджет','Аналитика','Цели','Капитал','Календарь','Настройки'].map((name,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};menu(false);render();window.scrollTo(0,0)">${ico(i)}${name}</button>`).join('');$('fab').hidden=![0,1,2].includes(tab);$('menuButton').innerHTML=ico(7);$('theme').innerHTML=ico(8);if(tab===5)view.insertAdjacentHTML('afterbegin',calendar());if(tab===4)view.insertAdjacentHTML('beforeend',historyChart());}
function menu(open){$('nav').classList.toggle('open',open);$('shade').hidden=!open;$('menuButton').setAttribute('aria-expanded',String(open));$('nav').inert=!open;document.body.style.overflow=open?'hidden':''}function ico(i){let paths=['M3 10 12 3l9 7v11h-6v-7H9v7H3z','M3 5h18v14H3z M3 9h18 M15 14h3','M4 20V10 M10 20V4 M16 20v-7 M22 20V7','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8','M3 9l9-6 9 6 M5 10v8 M12 10v8 M19 10v8 M3 21h18','M3 5h18v16H3z M7 3v4 M17 3v4 M3 10h18','M4 7h16 M4 12h16 M4 17h16 M8 5v4 M16 10v4 M10 15v4','M3 6h18 M3 12h18 M3 18h18','M12 3a9 9 0 1 0 0 18z'];return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[i]}"/></svg>`}function calendar(){let c=calc(month),offset=(new Date(+month.slice(0,4),+month.slice(5)-1,1).getDay()+6)%7;if(!selectedDay.startsWith(month))selectedDay=month+'-01';let events=d=>[...state.ops.filter(o=>o.date===d),...state.payments.filter(o=>o.date===d)];return `<section><h2>Финансовый календарь</h2><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:c.days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0');return `<button class="${d===selectedDay?'selected':''}" onclick="selectedDay='${d}';render()">${i+1}${events(d).length?'<span class="dot">●</span>':''}</button>`}).join('')}</div><h2>${selectedDay}</h2>${events(selectedDay).map(o=>row(esc(o.name),money(o.amount))).join('')||'Нет событий'}</section>`}function snapshot(){let value=sum(state.capital.filter(x=>x.type==='asset'))-sum(state.capital.filter(x=>x.type==='debt'));state.history=state.history.filter(x=>x.date!==today());state.history.push({date:today(),value})}function historyChart(){let h=state.history.slice().sort((a,b)=>a.date.localeCompare(b.date)),lo=Math.min(...h.map(x=>x.value)),hi=Math.max(...h.map(x=>x.value)),pts=h.map((x,i)=>`${10+i*280/Math.max(1,h.length-1)},${110-90*(x.value-lo)/Math.max(1,hi-lo)}`).join(' ');return `<section><h2>История капитала</h2>${h.length>1?`<svg viewBox="0 0 300 120" width="100%"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>`:'График появится после изменений капитала в разные дни.'}${h.slice(-5).reverse().map(x=>row(esc(x.date),money(x.value))).join('')}</section>`}

function rate(v){state.rates[month]=Math.min(100,Math.max(0,Number(v)||0));save();render()}function remove(k,id){if(confirm('Удалить запись?')){state[k]=state[k].filter(o=>o.id!==id);if(k==='capital')snapshot();save();render()}}const field=(label,name,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${extra}></label>`;const select=(label,name,values,v)=>`<label>${label}<select name="${name}">${values.map(([k,t])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;function modal(title,html,fn){$('formTitle').textContent=title;$('fields').innerHTML=html;$('entry').onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target)));save();dlg.close();render()};dlg.showModal()}function put(k,o,id){o.id=id||uid();state[k]=state[k].filter(x=>x.id!==o.id);state[k].push(o);if(k==='capital')snapshot()}function operation(id){let o=state.ops.find(x=>x.id===id)||{},type=o.type||'daily';modal('Операция',select('Тип','type',[['income','Доход'],['fixed','Обязательный расход'],['daily','Ежедневный расход']],type)+`<div id="catfield"></div>`+field('Описание','name',o.name||'')+field('Сумма','amount',o.amount||'','number','min="0.01" step="0.01"')+field('Дата','date',o.date||(month===today().slice(0,7)?today():month+'-01'),'date'),v=>put('ops',{...v,amount:+v.amount},id));let t=$('entry').elements.type;function categories(){let a=cats[t.value==='daily'?'fixed':t.value];$('catfield').innerHTML=select('Категория','category',a.map(x=>[x,x]),o.category)}t.onchange=categories;categories()}let goalPhoto='';function clearPhoto(el){goalPhoto='';el.textContent='Фото удалено'}function loadPhoto(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,640/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);goalPhoto=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}function goal(id){let o=state.goals.find(x=>x.id===id)||{};modal('Финансовая цель',field('Название','name',o.name)+field('Целевая сумма','target',o.target,'number','min="1" step="0.01"')+field('Накоплено','amount',o.amount??0,'number','min="0" step="0.01"')+field('Срок','date',o.date||today(),'date'),v=>put('goals',{...v,photo:goalPhoto,amount:+v.amount,target:+v.target},id));goalPhoto=o.photo||''; $('fields').insertAdjacentHTML('beforeend',select('Значок','icon',['◎','⌂','✈','♡','★','⚑','♧'].map(x=>[x,x]),o.icon||'◎')+'<label>Фото цели<input type="file" accept="image/*" onchange="loadPhoto(this)"></label><button type="button" onclick="clearPhoto(this)">Убрать фото</button>')}function capital(id){let o=state.capital.find(x=>x.id===id)||{};modal('Капитал',select('Тип','type',[['asset','Актив'],['debt','Обязательство']],o.type||'asset')+'<div id="capcat"></div>'+field('Сумма','amount',o.amount,'number','min="0" step="0.01"'),v=>put('capital',{...v,amount:+v.amount},id));let t=$('entry').elements.type;function cc(){$('capcat').innerHTML=select('Категория','name',cats[t.value].map(x=>[x,x]),o.name)}t.onchange=cc;cc()}function payment(){modal('Платёж',field('Название','name')+field('Сумма','amount','','number','min="0.01" step="0.01"')+field('Дата','date',today(),'date')+select('Повтор','repeat',[['no','Нет'],['yes','Ежемесячно']],'no'),v=>put('payments',{...v,amount:+v.amount,repeat:v.repeat==='yes'}))}function paid(id){let p=state.payments.find(x=>x.id===id);if(!confirm('Записать платёж как обязательный расход?'))return;put('ops',{type:'fixed',category:'Другое 1',name:p.name,amount:p.amount,date:today()});if(p.repeat){let [y,m,d]=p.date.split('-').map(Number),next=new Date(y,m,1),last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();p.date=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}else state.payments=state.payments.filter(x=>x.id!==id);save();render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('capital.json',JSON.stringify(state,null,2),'application/json')}function csv(){let q=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('capital.csv','\ufeff'+[['Дата','Тип','Категория','Описание','Сумма'],...state.ops.map(o=>[o.date,o.type,o.category,o.name,o.amount])].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if(!['ops','goals','capital','payments'].every(k=>Array.isArray(s[k])&&s[k].every(o=>typeof o.id==='string'&&/^[\w.-]+$/.test(o.id)&&Number.isFinite(o.amount)))||!s.rates||typeof s.rates!=='object'||!s.ops.every(o=>typeof o.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)))throw Error();if(confirm('Заменить текущие данные резервной копией?')){state=s;state.history=Array.isArray(state.history)?state.history:[];save();render()}}catch{alert('Некорректная копия')}}$('month').onchange=e=>{if(e.target.value){month=e.target.value;render()}};function theme(){document.body.classList.toggle('light',state.theme==='light'||state.theme==='auto'&&matchMedia('(prefers-color-scheme:light)').matches)}$('theme').onclick=()=>{state.theme=document.body.classList.contains('light')?'dark':'light';save();theme()};theme();menu(false);render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
