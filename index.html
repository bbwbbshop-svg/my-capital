const $=id=>document.getElementById(id), view=$('view'),dlg=$('dlg');const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state={ops:[],rates:{},goals:[],capital:[],payments:[],theme:'auto'};try{Object.assign(state,JSON.parse(localStorage.getItem('capital-v1')||'{}'))}catch{}state.history=Array.isArray(state.history)?state.history:[];let selectedDay=today();let tab=0,month=today().slice(0,7);$('month').value=month;const save=()=>localStorage.setItem('capital-v1',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const formatMoney=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';const money=n=>state.hideAmounts?`<span class="masked-money" role="button" tabindex="0" data-value="${Number(n)}" onclick="revealMoney(event,this)" onkeydown="if(event.key==='Enter'||event.key===' ')revealMoney(event,this)">•••• ₽</span>`:formatMoney(n);function revealMoney(e,el){e.stopPropagation();e.preventDefault();clearTimeout(el.revealTimer);el.textContent=formatMoney(el.dataset.value);el.revealTimer=setTimeout(()=>el.textContent='•••• ₽',5000)}function eye(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>${state.hideAmounts?'<path d="M3 3l18 18"/>':''}</svg>`}function togglePrivacy(){state.hideAmounts=!state.hideAmounts;save();render()}const sum=a=>a.reduce((s,o)=>s+Number(o.amount),0);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function calc(m){let a=state.ops.filter(o=>o.date.startsWith(m)),i=sum(a.filter(o=>o.type==='income')),f=sum(a.filter(o=>o.type==='fixed')),d=sum(a.filter(o=>o.type==='daily')),p=i*(state.rates[m]??10)/100,days=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return {a,i,f,d,p,days,b:(i-f-p)/days,r:i-f-d}}const tile=(label,n)=>`<section><small>${label}</small><h2>${money(n)}</h2></section>`;const row=(a,b)=>`<div class="row item"><span>${a}</span><strong>${b}</strong></div>`;const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;function openHomeTab(i){tab=i;menu(false);render();window.scrollTo(0,0)}function homeKey(e,i){if(e.key==='Enter'||e.key===' '){e.preventDefault();openHomeTab(i)}}function actionPair(edit,del){return `<div class="action-pair" role="group" aria-label="Действия"><button type="button" aria-label="Редактировать" onclick="${edit}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg></button><span class="action-divider" aria-hidden="true"></span><button type="button" aria-label="Удалить" onclick="${del}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>`}function render(){let c=calc(month),day=month===today().slice(0,7)?+today().slice(-2):month<today().slice(0,7)?c.days:0;let spent=sum(c.a.filter(o=>o.type==='daily'&&+o.date.slice(-2)<=day));let html='';if(tab===0){html=`<div class="home-group" role="button" tabindex="0" aria-label="Открыть бюджет" onclick="openHomeTab(1)" onkeydown="homeKey(event,1)"><div class="row group-title"><span>Бюджет</span><span aria-hidden="true">›</span></div><section><small>Остаток после расходов</small><div class="big">${money(c.r)}</div>${row('Доходы',money(c.i))}${row('Расходы',money(c.f+c.d))}</section><div class="grid">${tile('Бюджет на день',c.b)}${tile('Сальдо на сегодня',c.b*day-spent)}${tile('План накоплений',c.p)}${tile('Отклонение от плана',c.r-c.p)}</div></div><section class="home-link" role="button" tabindex="0" aria-label="Открыть календарь" onclick="openHomeTab(5)" onkeydown="homeKey(event,5)"><div class="row group-title"><h2>Ближайшие платежи</h2><span aria-hidden="true">›</span></div>${calHome()}</section><button class="primary" onclick="operation()">＋ Добавить операцию</button>`}if(tab===1){html=`<section><h2>План месяца</h2><label>Процент накоплений</label><input type="number" min="0" max="100" value="${state.rates[month]??10}" onchange="rate(this.value)">${row('Доходы',money(c.i))}${row('Обязательные расходы',money(c.f))}${row('Ежедневные расходы',money(c.d))}</section><button class="primary" onclick="operation()">＋ Операция</button><button class="category-link" onclick="openHomeTab(9)">История операций <span>›</span></button><section><h2>Операции</h2>${c.a.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<div class="item action-row"><div>${esc(o.name)}<br><small>${o.date} · ${esc(o.category)}</small></div><strong>${o.type==='income'?'+':'−'}${money(o.amount)}</strong>${actionPair(`operation('${o.id}')`,`remove('ops','${o.id}')`)}</div>`).join('')||'Пока нет операций'}</section>`}if(tab===2)html=analyticsScreen();if(tab===3){html=`<button class="primary" onclick="goal()">＋ Цель</button>${state.goals.map(g=>`<section>${g.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(g.photo)?`<img class="goalphoto" src="${esc(g.photo)}" alt="">`:`<span class="goalicon">${esc(g.icon||"◎")}</span>`}<h2>${esc(g.name)}</h2><div class="big">${money(g.amount)}</div><small>из ${money(g.target)} · до ${g.date}</small>${bar(100*g.amount/g.target)}<div class="goal-action-row"><div>${row('Осталось',money(Math.max(0,g.target-g.amount)))}</div>${actionPair(`goal('${g.id}')`,`remove('goals','${g.id}')`)}</div></section>`).join('')||'<section>Добавь первую финансовую цель.</section>'}`}if(tab===4){let a=sum(state.capital.filter(x=>x.type==='asset')),b=sum(state.capital.filter(x=>x.type==='debt'));html=`<section><small>Чистый капитал</small><div class="big">${money(a-b)}</div>${row('Активы',money(a))}${row('Обязательства',money(b))}</section><button class="primary" onclick="capital()">＋ Актив / долг</button><section>${state.capital.map(o=>`<div class="item action-row"><div>${esc(o.name)}</div><strong>${money(o.amount)}</strong>${actionPair(`capital('${o.id}')`,`remove('capital','${o.id}')`)}</div>`).join('')}</section>`}if(tab===5)html=smartCalendar();if(tab===6){html=`<section><h2>Персонализация</h2><button class="category-link" onclick="openHomeTab(10)">Мои категории <span>›</span></button><button class="category-link" onclick="calPrefs()">Настройки календаря <span>›</span></button><button class="category-link" onclick="histSettings()">Настройки истории <span>›</span></button></section><section><h2>Данные</h2><button onclick="backup()">Резервная копия JSON</button> <button onclick="csv()">Экспорт CSV для Excel</button><label>Восстановить из JSON</label><input type="file" accept=".json" onchange="restore(this)"><p class="muted">Данные хранятся в этом браузере. Синхронизация и защита пока не подключены.</p></section>`}if(tab===7)html=dailyBudget(c);if(tab===8){let year=month.slice(0,4);html='<section><h2>Годовая сводка · '+year+'</h2>'+Array.from({length:12},(_,i)=>{let m=year+'-'+String(i+1).padStart(2,'0'),v=calc(m);return row(m,money(v.i-v.f-v.d))}).join('')+'</section>'}if(tab===9)html=histScreen();if(tab===10)html=categoryScreen();document.querySelector('main h1').textContent=tab===2?'Аналитика':tab===5?'Календарь':tab===9?'История операций':'Мой капитал';$('month').style.display=[2,5,9].includes(tab)?'none':'';view.innerHTML=html; $('dailyFab').hidden=tab!==0;renderNav();$('fab').onclick=()=>tab===5?calEdit():operation();$('fab').hidden=![0,1,2,5,7].includes(tab);$('menuButton').innerHTML=ico(7);$('theme').innerHTML=eye();$('theme').setAttribute('aria-label',state.hideAmounts?'Показать суммы':'Скрыть суммы');if(tab===4)view.insertAdjacentHTML('beforeend',historyChart());}
